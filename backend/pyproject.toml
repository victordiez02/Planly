[project]
name = "plans-backend"
version = "0.1.0"
description = "Backend FastAPI para la app Plans"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "apscheduler>=3.10",
  "jinja2>=3.1",
  "email-validator>=2.1",
  "aiosmtplib>=3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
target-version = "py311"
